<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz IA & Génie Civil – Club Génie Civil 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #07111f;
            --surface: #0d1e35;
            --surface2: #122540;
            --border: #1b3558;
            --accent: #f0a800;
            --accent2: #ffd166;
            --accent3: #5ba4e5;
            --text: #e8f0fa;
            --text-muted: #6a8aaa;
            --correct: #34d399;
            --wrong: #f87171;
            --radius: 16px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Blueprint grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(91,164,229,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91,164,229,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Gold glow top-left + blue glow bottom-right */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 40% at 10% 10%, rgba(240,168,0,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 90% 90%, rgba(91,164,229,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 35% at 50% 50%, rgba(13,30,53,0.5) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Animated neural-net canvas behind everything */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .quiz-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(240,168,0,0.08); position: relative; z-index: 1;
        }


        /* ── CONFERENCE BANNER ── */
        .conf-banner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .conf-logo {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }
        .conf-info { display: flex; flex-direction: column; gap: 3px; }
        .conf-title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
        }
        .conf-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .conf-event {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent3);
            margin-top: 2px;
        }
        .conf-theme {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ── HEADER ── */
        .quiz-header {
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #0f2545 0%, var(--surface) 100%); border-bottom: 1px solid rgba(240,168,0,0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .question-counter {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--border);
            padding: 6px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Timer SVG */
        .timer-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .timer-svg {
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }

        .timer-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 138.2;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        /* Progress bar */
        .progress-container {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 10%;
        }

        /* ── CONTENT ── */
        .quiz-content {
            padding: 32px 28px 28px;
        }

        .question-number-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .question-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.45;
            color: var(--text);
            margin-bottom: 28px;
            min-height: 60px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-align: left;
        }

        .option:hover:not(.disabled) {
            border-color: var(--accent);
            background: rgba(240,168,0,0.07);
            transform: translateX(4px);
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option.selected {
            border-color: var(--accent);
            background: rgba(240,168,0,0.10);
        }

        .option.selected .option-letter {
            background: var(--accent);
            color: #0d0d0f;
        }

        .option.correct {
            border-color: var(--correct);
            background: rgba(78,205,196,0.1);
        }

        .option.correct .option-letter {
            background: var(--correct);
            color: #0d0d0f;
        }

        .option.wrong {
            border-color: var(--wrong);
            background: rgba(255,107,107,0.08);
        }

        .option.wrong .option-letter {
            background: var(--wrong);
            color: #fff;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-restart {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        .btn-restart:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .btn-next {
            background: var(--accent);
            color: #0d0d0f;
            display: none;
        }

        .btn-next:hover {
            background: #f5d060;
            transform: translateY(-1px);
        }

        .btn-next.visible {
            display: block;
        }

        /* ── RESULT ── */
        .result-container {
            padding: 48px 28px;
            text-align: center;
        }

        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .result-icon {
            font-size: 4rem;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .result-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .final-score {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .final-score span {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.1;
        }

        .result-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }

        .stat-chip {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .stat-correct {
            background: rgba(78,205,196,0.15);
            color: var(--correct);
            border: 1px solid rgba(78,205,196,0.3);
        }

        .stat-wrong {
            background: rgba(255,107,107,0.12);
            color: var(--wrong);
            border: 1px solid rgba(255,107,107,0.25);
        }

        .btn-primary {
            background: var(--accent);
            color: #0d0d0f;
            font-size: 1rem;
            padding: 14px 32px;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #f5d060;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(240,192,64,0.3);
        }

        /* Feedback flash */
        .feedback-bar {
            height: 3px;
            width: 100%;
            border-radius: 2px;
            margin-top: -1px;
            transition: background 0.3s;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .quiz-content { animation: fadeInUp 0.4s ease; }

        .option { animation: fadeInUp 0.3s ease both; }
        .option:nth-child(1) { animation-delay: 0.05s; }
        .option:nth-child(2) { animation-delay: 0.10s; }
        .option:nth-child(3) { animation-delay: 0.15s; }
        .option:nth-child(4) { animation-delay: 0.20s; }

        @media (max-width: 480px) {
            .quiz-header { padding: 20px 18px 16px; }
            .quiz-content { padding: 24px 18px 20px; }
            h1 { font-size: 1.3rem; }
            .question-text { font-size: 1.05rem; }
        }
    </style>
</head>

                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="quiz-content" id="quizContent">
                <div class="question-number-label" id="questionLabel">Question 1</div>
                <div class="question-text" id="questionText">Chargement...</div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="button-group">
                    <button class="btn btn-restart" id="restartBtn">🔄 Recommencer</button>
                    <button class="btn btn-next" id="nextBtn">Suivant →</button>
                </div>
            </div>

            <div class="result-container" id="resultContainer" style="display:none;">
                <div class="result-card">
                    <div class="result-icon" id="resultIcon">🏆</div>
                    <h2>Quiz terminé !</h2>
                    <div class="final-score">
                        Votre score<br>
                        <span id="finalScoreNum">0/10</span>
                    </div>
                    <div class="result-stats" id="resultStats"></div>
                    <button class="btn btn-primary" id="playAgainBtn">🎮 Rejouer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const QUESTIONS = [
        {
            question: "Quelle est la principale fonction d'un chaînage dans une maçonnerie ?",
            options: [
                "Assurer l'esthétique du mur",
                "Relier les murs et répartir les efforts",
                "Protéger contre l'humidité",
                "Augmenter la hauteur de construction"
            ],
            answer: 1
        },
        {
            question: "Sur un chantier, que signifie le sigle « EP » sur un plan ?",
            options: [
                "Égout Pluvial",
                "Équipement Principal",
                "Espace de Parking",
                "Énergie Photovoltaïque"
            ],
            answer: 0
        },
        {
            question: "Dans un projet de fondation, quel type de sol présente généralement le risque de retrait-gonflement le plus important ?",
            options: [
                "Sable dense",
                "Argile plastique",
                "Grave calcaire",
                "Roche saine"
            ],
            answer: 1
        },
        {
            question: "Quelle est la norme européenne de référence pour le calcul des structures en béton armé ?",
            options: [
                "Eurocode 1",
                "Eurocode 2",
                "Eurocode 5",
                "Eurocode 7"
            ],
            answer: 1
        },
        {
            question: "La flèche instantanée d'une poutre en béton armé est principalement due à :",
            options: [
                "La fissuration du béton",
                "La déformation élastique",
                "Le fluage à long terme",
                "Le retrait du béton"
            ],
            answer: 1
        },
        {
            question: "Dans un terrassement, le « coefficient de foisonnement » sert à :",
            options: [
                "Calculer la quantité de matériaux compactés",
                "Estimer l'augmentation de volume après excavation",
                "Déterminer la portance du sol",
                "Calculer la pente de talus"
            ],
            answer: 1
        },
        {
            question: "Selon l'Eurocode 7, quelle combinaison est généralement la plus défavorable pour le calcul de la portance des fondations superficielles ?",
            options: [
                "Combinaison 1 (A1 + M1 + R1)",
                "Combinaison 2 (A2 + M2 + R1)",
                "Combinaison 3 (A1 + M2 + R3)",
                "Combinaison 4 (A2 + M1 + R2)"
            ],
            answer: 1
        },
        {
            question: "Dans l'analyse dynamique d'une structure, le « facteur de comportement q » (Eurocode 8) permet de :",
            options: [
                "Augmenter la période propre de la structure",
                "Réduire les efforts sismiques en tenant compte de la ductilité",
                "Calculer uniquement la masse modale",
                "Déterminer l'amortissement visqueux"
            ],
            answer: 1
        },
        {
            question: "En modélisation éléments finis d'une dalle en béton, le phénomène de « shear-lag » affecte principalement :",
            options: [
                "La répartition des contraintes de compression dans les membrures larges",
                "Le flambement local des armatures",
                "Le fluage différé du béton",
                "La fissuration de service sous moment négatif"
            ],
            answer: 0
        },
        {
            question: "La méthode « phi-c reduction » (Eurocode 7) est principalement utilisée pour :",
            options: [
                "Calculer la portance d'une fondation",
                "Déterminer le coefficient de sécurité global d'un talus ou d'un ouvrage en terre",
                "Évaluer le tassement consolidé",
                "Dimensionner les écrans de soutènement"
            ],
            answer: 1
        }
    ];

    const TIMER_MAX = 15;
    const CIRCUMFERENCE = 2 * Math.PI * 22; // 138.2

    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = TIMER_MAX;
    let correctCount = 0;
    let wrongCount = 0;

    const questionCounter = document.getElementById('questionCounter');
    const questionLabel    = document.getElementById('questionLabel');
    const questionText     = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressBar      = document.getElementById('progressBar');
    const timerText        = document.getElementById('timerText');
    const timerCircle      = document.getElementById('timerCircle');
    const nextBtn          = document.getElementById('nextBtn');
    const restartBtn       = document.getElementById('restartBtn');
    const quizContent      = document.getElementById('quizContent');
    const resultContainer  = document.getElementById('resultContainer');
    const finalScoreNum    = document.getElementById('finalScoreNum');
    const resultStats      = document.getElementById('resultStats');
    const playAgainBtn     = document.getElementById('playAgainBtn');
    const resultIcon       = document.getElementById('resultIcon');

    function loadQuestion() {
        answered = false;
        timeLeft = TIMER_MAX;
        nextBtn.classList.remove('visible');

        const q = QUESTIONS[currentIndex];
        const total = QUESTIONS.length;

        questionCounter.textContent = `Question ${currentIndex + 1}/${total}`;
        questionLabel.textContent   = `Question ${currentIndex + 1}`;
        questionText.textContent    = q.question;
        progressBar.style.width     = `${((currentIndex) / total) * 100}%`;

        // Build options
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
            btn.addEventListener('click', () => selectAnswer(i, btn));
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function selectAnswer(index, btnEl) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const correct = QUESTIONS[currentIndex].answer;
        const allOptions = optionsContainer.querySelectorAll('.option');

        allOptions.forEach(o => o.classList.add('disabled'));

        if (index === correct) {
            btnEl.classList.add('correct');
            score++;
            correctCount++;
        } else {
            btnEl.classList.add('wrong');
            wrongCount++;
            allOptions[correct].classList.add('correct');
        }

        nextBtn.classList.add('visible');
    }

    function startTimer() {
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeExpired();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        timerText.textContent = timeLeft;
        const progress = timeLeft / TIMER_MAX;
        const offset = CIRCUMFERENCE * (1 - progress);
        timerCircle.style.strokeDashoffset = offset;

        if (timeLeft <= 5) {
            timerCircle.style.stroke = 'var(--wrong)';
        } else if (timeLeft <= 8) {
            timerCircle.style.stroke = '#f5a623';
        } else {
            timerCircle.style.stroke = 'var(--accent)';
        }
    }

    function timeExpired() {
        if (answered) return;
        answered = true;
        const correct = QUESTIONS[currentIndex].answer;
        const allOptions = optionsContainer.querySelectorAll('.option');
        allOptions.forEach(o => o.classList.add('disabled'));
        allOptions[correct].classList.add('correct');
        wrongCount++;
        nextBtn.classList.add('visible');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= QUESTIONS.length) {
            showResult();
        } else {
            loadQuestion();
        }
    }

    function showResult() {
        clearInterval(timerInterval);
        quizContent.style.display = 'none';
        resultContainer.style.display = 'block';

        const total = QUESTIONS.length;
        const pct = Math.round((score / total) * 100);

        finalScoreNum.textContent = `${score}/${total}`;

        if (pct === 100)      resultIcon.textContent = '🏆';
        else if (pct >= 70)   resultIcon.textContent = '🎉';
        else if (pct >= 40)   resultIcon.textContent = '🙂';
        else                   resultIcon.textContent = '😅';

        resultStats.innerHTML = `
            <span class="stat-chip stat-correct">✓ ${correctCount} correctes</span>
            <span class="stat-chip stat-wrong">✗ ${wrongCount} incorrectes</span>
        `;

        progressBar.style.width = '100%';
    }

    function restartQuiz() {
        currentIndex  = 0;
        score         = 0;
        correctCount  = 0;
        wrongCount    = 0;
        quizContent.style.display   = 'block';
        resultContainer.style.display = 'none';
        loadQuestion();
    }

    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restartQuiz);
    playAgainBtn.addEventListener('click', restartQuiz);

    // Init
    loadQuestion();

    // ── BACKGROUND: Neural net + blueprint nodes ──
    (function() {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], edges = [];

        const GOLD  = 'rgba(240,168,0,';
        const BLUE  = 'rgba(91,164,229,';
        const WHITE = 'rgba(232,240,250,';

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            init();
        }

        function rand(a, b) { return a + Math.random() * (b - a); }

        function init() {
            nodes = [];
            edges = [];
            const count = Math.floor((W * H) / 22000);
            for (let i = 0; i < count; i++) {
                nodes.push({
                    x: rand(0, W), y: rand(0, H),
                    vx: rand(-0.18, 0.18), vy: rand(-0.18, 0.18),
                    r: rand(1.5, 3.5),
                    type: Math.random() < 0.5 ? 'gold' : 'blue',
                    pulse: rand(0, Math.PI * 2),
                    pulseSpeed: rand(0.01, 0.03)
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Draw edges between close nodes
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const maxDist = 140;
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.25;
                        const col = (nodes[i].type === 'gold' || nodes[j].type === 'gold') ? GOLD : BLUE;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = col + alpha + ')';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            // Draw nodes
            for (const n of nodes) {
                n.pulse += n.pulseSpeed;
                const glow = 1 + 0.4 * Math.sin(n.pulse);
                const col = n.type === 'gold' ? GOLD : BLUE;

                // Outer glow
                const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4 * glow);
                grad.addColorStop(0,   col + '0.35)');
                grad.addColorStop(0.5, col + '0.10)');
                grad.addColorStop(1,   col + '0)');
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r * 4 * glow, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Core dot
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r * glow, 0, Math.PI * 2);
                ctx.fillStyle = col + '0.8)';
                ctx.fill();

                // Move
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < -20) n.x = W + 20;
                if (n.x > W + 20) n.x = -20;
                if (n.y < -20) n.y = H + 20;
                if (n.y > H + 20) n.y = -20;
            }

            // Draw subtle bridge cable parabola at bottom
            const cableY = H * 0.92;
            const segments = 5;
            ctx.beginPath();
            for (let s = 0; s < segments; s++) {
                const x0 = (W / segments) * s;
                const x1 = (W / segments) * (s + 1);
                const xm = (x0 + x1) / 2;
                const sag = rand(30, 60);
                ctx.moveTo(x0, cableY - sag * 0.5);
                ctx.quadraticCurveTo(xm, cableY + sag, x1, cableY - sag * 0.5);
            }
            ctx.strokeStyle = GOLD + '0.07)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    })();

    </script>
</body>
</html>
