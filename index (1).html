<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QuizMaster - Testez vos connaissances</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --surface2: #1e1e24;
            --border: #2a2a35;
            --accent: #f0c040;
            --accent2: #ff6b6b;
            --accent3: #4ecdc4;
            --text: #f0eff4;
            --text-muted: #7e7e9a;
            --correct: #4ecdc4;
            --wrong: #ff6b6b;
            --radius: 16px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(240,192,64,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(78,205,196,0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .quiz-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }

        /* ── HEADER ── */
        .quiz-header {
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .question-counter {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--border);
            padding: 6px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Timer SVG */
        .timer-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .timer-svg {
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }

        .timer-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 138.2;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        /* Progress bar */
        .progress-container {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent3));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 10%;
        }

        /* ── CONTENT ── */
        .quiz-content {
            padding: 32px 28px 28px;
        }

        .question-number-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .question-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.45;
            color: var(--text);
            margin-bottom: 28px;
            min-height: 60px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-align: left;
        }

        .option:hover:not(.disabled) {
            border-color: var(--accent);
            background: rgba(240,192,64,0.06);
            transform: translateX(4px);
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option.selected {
            border-color: var(--accent);
            background: rgba(240,192,64,0.08);
        }

        .option.selected .option-letter {
            background: var(--accent);
            color: #0d0d0f;
        }

        .option.correct {
            border-color: var(--correct);
            background: rgba(78,205,196,0.1);
        }

        .option.correct .option-letter {
            background: var(--correct);
            color: #0d0d0f;
        }

        .option.wrong {
            border-color: var(--wrong);
            background: rgba(255,107,107,0.08);
        }

        .option.wrong .option-letter {
            background: var(--wrong);
            color: #fff;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-restart {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        .btn-restart:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .btn-next {
            background: var(--accent);
            color: #0d0d0f;
            display: none;
        }

        .btn-next:hover {
            background: #f5d060;
            transform: translateY(-1px);
        }

        .btn-next.visible {
            display: block;
        }

        /* ── RESULT ── */
        .result-container {
            padding: 48px 28px;
            text-align: center;
        }

        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .result-icon {
            font-size: 4rem;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .result-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .final-score {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .final-score span {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.1;
        }

        .result-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }

        .stat-chip {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .stat-correct {
            background: rgba(78,205,196,0.15);
            color: var(--correct);
            border: 1px solid rgba(78,205,196,0.3);
        }

        .stat-wrong {
            background: rgba(255,107,107,0.12);
            color: var(--wrong);
            border: 1px solid rgba(255,107,107,0.25);
        }

        .btn-primary {
            background: var(--accent);
            color: #0d0d0f;
            font-size: 1rem;
            padding: 14px 32px;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #f5d060;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(240,192,64,0.3);
        }

        /* Feedback flash */
        .feedback-bar {
            height: 3px;
            width: 100%;
            border-radius: 2px;
            margin-top: -1px;
            transition: background 0.3s;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .quiz-content { animation: fadeInUp 0.4s ease; }

        .option { animation: fadeInUp 0.3s ease both; }
        .option:nth-child(1) { animation-delay: 0.05s; }
        .option:nth-child(2) { animation-delay: 0.10s; }
        .option:nth-child(3) { animation-delay: 0.15s; }
        .option:nth-child(4) { animation-delay: 0.20s; }

        @media (max-width: 480px) {
            .quiz-header { padding: 20px 18px 16px; }
            .quiz-content { padding: 24px 18px 20px; }
            h1 { font-size: 1.3rem; }
            .question-text { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-wrapper">
            <div class="quiz-header">
                <div class="header-top">
                    <h1>🎯 QuizMaster</h1>
                    <div class="stats">
                        <div class="question-counter" id="questionCounter">Question 1/10</div>
                        <div class="timer-container">
                            <svg class="timer-svg" width="48" height="48" viewBox="0 0 50 50">
                                <circle class="timer-bg" cx="25" cy="25" r="22"/>
                                <circle class="timer-progress" id="timerCircle" cx="25" cy="25" r="22"/>
                            </svg>
                            <span class="timer-text" id="timerText">15</span>
                        </div>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="quiz-content" id="quizContent">
                <div class="question-number-label" id="questionLabel">Question 1</div>
                <div class="question-text" id="questionText">Chargement...</div>
                <div class="options-container" id="optionsContainer"></div>
                <div class="button-group">
                    <button class="btn btn-restart" id="restartBtn">🔄 Recommencer</button>
                    <button class="btn btn-next" id="nextBtn">Suivant →</button>
                </div>
            </div>

            <div class="result-container" id="resultContainer" style="display:none;">
                <div class="result-card">
                    <div class="result-icon" id="resultIcon">🏆</div>
                    <h2>Quiz terminé !</h2>
                    <div class="final-score">
                        Votre score<br>
                        <span id="finalScoreNum">0/10</span>
                    </div>
                    <div class="result-stats" id="resultStats"></div>
                    <button class="btn btn-primary" id="playAgainBtn">🎮 Rejouer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const QUESTIONS = [
        {
            question: "Quelle est la capitale de la France ?",
            options: ["Lyon", "Marseille", "Paris", "Bordeaux"],
            answer: 2
        },
        {
            question: "Combien y a-t-il de continents sur Terre ?",
            options: ["5", "6", "7", "8"],
            answer: 2
        },
        {
            question: "Quel est le plus grand océan du monde ?",
            options: ["Atlantique", "Indien", "Arctique", "Pacifique"],
            answer: 3
        },
        {
            question: "En quelle année a eu lieu la Révolution française ?",
            options: ["1776", "1789", "1804", "1815"],
            answer: 1
        },
        {
            question: "Quelle planète est la plus proche du Soleil ?",
            options: ["Vénus", "Terre", "Mercure", "Mars"],
            answer: 2
        },
        {
            question: "Qui a peint la Joconde ?",
            options: ["Michel-Ange", "Raphaël", "Botticelli", "Léonard de Vinci"],
            answer: 3
        },
        {
            question: "Quelle est la formule chimique de l'eau ?",
            options: ["CO₂", "O₂", "H₂O", "NaCl"],
            answer: 2
        },
        {
            question: "Quel est le pays le plus grand du monde par superficie ?",
            options: ["Canada", "Chine", "États-Unis", "Russie"],
            answer: 3
        },
        {
            question: "Combien de côtés a un hexagone ?",
            options: ["5", "6", "7", "8"],
            answer: 1
        },
        {
            question: "Quel animal est le plus rapide sur terre ?",
            options: ["Lion", "Guépard", "Faucon", "Antilope"],
            answer: 1
        }
    ];

    const TIMER_MAX = 15;
    const CIRCUMFERENCE = 2 * Math.PI * 22; // 138.2

    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = TIMER_MAX;
    let correctCount = 0;
    let wrongCount = 0;

    const questionCounter = document.getElementById('questionCounter');
    const questionLabel    = document.getElementById('questionLabel');
    const questionText     = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const progressBar      = document.getElementById('progressBar');
    const timerText        = document.getElementById('timerText');
    const timerCircle      = document.getElementById('timerCircle');
    const nextBtn          = document.getElementById('nextBtn');
    const restartBtn       = document.getElementById('restartBtn');
    const quizContent      = document.getElementById('quizContent');
    const resultContainer  = document.getElementById('resultContainer');
    const finalScoreNum    = document.getElementById('finalScoreNum');
    const resultStats      = document.getElementById('resultStats');
    const playAgainBtn     = document.getElementById('playAgainBtn');
    const resultIcon       = document.getElementById('resultIcon');

    function loadQuestion() {
        answered = false;
        timeLeft = TIMER_MAX;
        nextBtn.classList.remove('visible');

        const q = QUESTIONS[currentIndex];
        const total = QUESTIONS.length;

        questionCounter.textContent = `Question ${currentIndex + 1}/${total}`;
        questionLabel.textContent   = `Question ${currentIndex + 1}`;
        questionText.textContent    = q.question;
        progressBar.style.width     = `${((currentIndex) / total) * 100}%`;

        // Build options
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
            btn.addEventListener('click', () => selectAnswer(i, btn));
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function selectAnswer(index, btnEl) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const correct = QUESTIONS[currentIndex].answer;
        const allOptions = optionsContainer.querySelectorAll('.option');

        allOptions.forEach(o => o.classList.add('disabled'));

        if (index === correct) {
            btnEl.classList.add('correct');
            score++;
            correctCount++;
        } else {
            btnEl.classList.add('wrong');
            wrongCount++;
            allOptions[correct].classList.add('correct');
        }

        nextBtn.classList.add('visible');
    }

    function startTimer() {
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeExpired();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        timerText.textContent = timeLeft;
        const progress = timeLeft / TIMER_MAX;
        const offset = CIRCUMFERENCE * (1 - progress);
        timerCircle.style.strokeDashoffset = offset;

        if (timeLeft <= 5) {
            timerCircle.style.stroke = 'var(--wrong)';
        } else if (timeLeft <= 8) {
            timerCircle.style.stroke = '#f5a623';
        } else {
            timerCircle.style.stroke = 'var(--accent)';
        }
    }

    function timeExpired() {
        if (answered) return;
        answered = true;
        const correct = QUESTIONS[currentIndex].answer;
        const allOptions = optionsContainer.querySelectorAll('.option');
        allOptions.forEach(o => o.classList.add('disabled'));
        allOptions[correct].classList.add('correct');
        wrongCount++;
        nextBtn.classList.add('visible');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= QUESTIONS.length) {
            showResult();
        } else {
            loadQuestion();
        }
    }

    function showResult() {
        clearInterval(timerInterval);
        quizContent.style.display = 'none';
        resultContainer.style.display = 'block';

        const total = QUESTIONS.length;
        const pct = Math.round((score / total) * 100);

        finalScoreNum.textContent = `${score}/${total}`;

        if (pct === 100)      resultIcon.textContent = '🏆';
        else if (pct >= 70)   resultIcon.textContent = '🎉';
        else if (pct >= 40)   resultIcon.textContent = '🙂';
        else                   resultIcon.textContent = '😅';

        resultStats.innerHTML = `
            <span class="stat-chip stat-correct">✓ ${correctCount} correctes</span>
            <span class="stat-chip stat-wrong">✗ ${wrongCount} incorrectes</span>
        `;

        progressBar.style.width = '100%';
    }

    function restartQuiz() {
        currentIndex  = 0;
        score         = 0;
        correctCount  = 0;
        wrongCount    = 0;
        quizContent.style.display   = 'block';
        resultContainer.style.display = 'none';
        loadQuestion();
    }

    nextBtn.addEventListener('click', nextQuestion);
    restartBtn.addEventListener('click', restartQuiz);
    playAgainBtn.addEventListener('click', restartQuiz);

    // Init
    loadQuestion();
    </script>
</body>
</html>
