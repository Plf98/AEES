<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quiz IA & Génie Civil – Club Génie Civil 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #07111f;
            --surface: #0d1e35;
            --surface2: #122540;
            --border: #1b3558;
            --accent: #f0a800;
            --accent2: #ffd166;
            --accent3: #5ba4e5;
            --text: #e8f0fa;
            --text-muted: #6a8aaa;
            --correct: #34d399;
            --wrong: #f87171;
            --radius: 16px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Blueprint grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(91,164,229,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(91,164,229,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Gold glow top-left + blue glow bottom-right */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 40% at 10% 10%, rgba(240,168,0,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 90% 90%, rgba(91,164,229,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 35% at 50% 50%, rgba(13,30,53,0.5) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Animated neural-net canvas behind everything */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        .quiz-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(240,168,0,0.08); 
            backdrop-filter: blur(0px);
            transition: all 0.2s;
        }

        /* ── CONFERENCE BANNER ── */
        .conf-banner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 0 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }
        .conf-logo {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border);
            background: #101f2f;
        }
        .conf-info { display: flex; flex-direction: column; gap: 3px; }
        .conf-title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
        }
        .conf-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
        .conf-event {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent3);
            margin-top: 2px;
        }
        .conf-theme {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ── HEADER ── */
        .quiz-header {
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #0f2545 0%, var(--surface) 100%); 
            border-bottom: 1px solid rgba(240,168,0,0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .question-counter {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--border);
            padding: 6px 12px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Timer SVG */
        .timer-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .timer-svg {
            transform: rotate(-90deg);
        }

        .timer-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }

        .timer-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 138.2;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s linear, stroke 0.3s;
        }

        .timer-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
        }

        /* Progress bar */
        .progress-container {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 10%;
        }

        /* ── CONTENT ── */
        .quiz-content {
            padding: 32px 28px 28px;
        }

        .question-number-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .question-text {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.45;
            color: var(--text);
            margin-bottom: 28px;
            min-height: 60px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            text-align: left;
        }

        .option:hover:not(.disabled) {
            border-color: var(--accent);
            background: rgba(240,168,0,0.07);
            transform: translateX(4px);
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option.selected {
            border-color: var(--accent);
            background: rgba(240,168,0,0.10);
        }

        .option.selected .option-letter {
            background: var(--accent);
            color: #0d0d0f;
        }

        .option.correct {
            border-color: var(--correct);
            background: rgba(78,205,196,0.12);
        }

        .option.correct .option-letter {
            background: var(--correct);
            color: #0d0d0f;
        }

        .option.wrong {
            border-color: var(--wrong);
            background: rgba(255,107,107,0.08);
        }

        .option.wrong .option-letter {
            background: var(--wrong);
            color: #fff;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.8;
            pointer-events: none;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-restart {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        .btn-restart:hover {
            border-color: var(--text-muted);
            color: var(--text);
        }

        .btn-next {
            background: var(--accent);
            color: #0d0d0f;
            display: none;
        }

        .btn-next:hover {
            background: #f5d060;
            transform: translateY(-1px);
        }

        .btn-next.visible {
            display: block;
        }

        /* ── RESULT ── */
        .result-container {
            padding: 48px 28px;
            text-align: center;
        }

        .result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .result-icon {
            font-size: 4rem;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        .result-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .final-score {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .final-score span {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            line-height: 1.1;
        }

        .result-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }

        .stat-chip {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .stat-correct {
            background: rgba(78,205,196,0.15);
            color: var(--correct);
            border: 1px solid rgba(78,205,196,0.3);
        }

        .stat-wrong {
            background: rgba(255,107,107,0.12);
            color: var(--wrong);
            border: 1px solid rgba(255,107,107,0.25);
        }

        .btn-primary {
            background: var(--accent);
            color: #0d0d0f;
            font-size: 1rem;
            padding: 14px 32px;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #f5d060;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(240,192,64,0.3);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .quiz-content { animation: fadeInUp 0.4s ease; }

        .option { animation: fadeInUp 0.3s ease both; }
        .option:nth-child(1) { animation-delay: 0.05s; }
        .option:nth-child(2) { animation-delay: 0.10s; }
        .option:nth-child(3) { animation-delay: 0.15s; }
        .option:nth-child(4) { animation-delay: 0.20s; }

        @media (max-width: 480px) {
            .quiz-header { padding: 20px 18px 16px; }
            .quiz-content { padding: 24px 18px 20px; }
            h1 { font-size: 1.3rem; }
            .question-text { font-size: 1.05rem; }
        }
    </style>
</head>
